<form class="space-y-4" #createdForm="ngForm" (ngSubmit)="create()">
  <div>
    <input
      class="w-full bg-transparent border-b border-outline-variant py-3 focus:border-secondary focus:ring-0 transition-colors font-body-md"
      placeholder="Ad Soyad"
      type="text"
      name="fullName"
      required
      [(ngModel)]="contactMessage.fullname"
    />
  </div>
  <div>
    <input
      class="w-full bg-transparent border-b border-outline-variant py-3 focus:border-secondary focus:ring-0 transition-colors font-body-md"
      placeholder="E-posta"
      type="email"
      name="email"
      required
      [(ngModel)]="contactMessage.email"
      ]
    />
  </div>
  <div>
    <textarea
      class="w-full bg-transparent border-b border-outline-variant py-3 focus:border-secondary focus:ring-0 transition-colors font-body-md resize-none"
      placeholder="Mesaj"
      rows="4"
      name="messageDetail"
      required
      [(ngModel)]="contactMessage.messageDetail"
      ]
    ></textarea>
  </div>
  <button
    class="bg-secondary text-on-secondary font-label-sm text-label-sm px-8 py-4 uppercase tracking-widest hover:bg-on-surface transition-colors duration-300 w-full md:w-auto"
    type="submit"
    [disabled]="createdForm.invalid"
  >
    Gönder
  </button>
</form>
