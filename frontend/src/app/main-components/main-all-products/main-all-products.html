<section
  class="pt-[80px] py-section-gap px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto"
  id="all-products"
>
  <div class="mb-stack-lg">
    <h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Tüm Ürünler</h1>
    <p class="font-body-md text-body-md text-on-surface-variant">
      {{ filteredProducts().length }} ürün listeleniyor
    </p>
  </div>

  <!-- Category Filters -->
  <div class="flex flex-wrap gap-2 mb-stack-lg">
    <button
      (click)="selectCategory(null)"
      class="px-5 py-2 rounded-full border font-label-sm text-label-sm transition-colors duration-200"
      [class.bg-primary]="selectedCategoryId() === null"
      [class.text-on-primary]="selectedCategoryId() === null"
      [class.border-primary]="selectedCategoryId() === null"
      [class.text-on-surface-variant]="selectedCategoryId() !== null"
      [class.border-outline-variant]="selectedCategoryId() !== null"
    >
      Tümü
    </button>
    @for (category of categories(); track category.id) {
      <button
        (click)="selectCategory(category.id)"
        class="px-5 py-2 rounded-full border font-label-sm text-label-sm transition-colors duration-200"
        [class.bg-primary]="selectedCategoryId() === category.id"
        [class.text-on-primary]="selectedCategoryId() === category.id"
        [class.border-primary]="selectedCategoryId() === category.id"
        [class.text-on-surface-variant]="selectedCategoryId() !== category.id"
        [class.border-outline-variant]="selectedCategoryId() !== category.id"
      >
        {{ category.name }}
      </button>
    }
  </div>

  <!-- Product Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-gutter">
    @for (item of filteredProducts(); track item.id) {
      <div class="group cursor-pointer">
        <div
          class="relative bg-surface-container-lowest aspect-[3/4] mb-stack-md overflow-hidden flex items-center justify-center p-8 shadow-[0_4px_24px_rgba(124,82,99,0.05)] transition-shadow duration-300 group-hover:shadow-[0_8px_32px_rgba(124,82,99,0.1)]"
        >
          <img
            class="w-full h-full object-contain mix-blend-darken transition-transform duration-700 group-hover:scale-105"
            alt="{{ item.name }}"
            src="{{ item.imageUrl }}"
          />
          <div
            class="absolute inset-x-0 bottom-0 p-4 opacity-0 transform translate-y-4 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300"
          >
            <button
              class="w-full bg-surface/90 backdrop-blur text-primary font-label-sm text-label-sm py-3 border border-outline-variant hover:bg-secondary hover:text-on-secondary hover:border-secondary transition-colors"
            >
              Quick Add
            </button>
          </div>
        </div>
        <div class="flex justify-between items-start">
          <div>
            <h3 class="font-headline-md text-[20px] text-on-surface mb-1">{{ item.name }}</h3>
            <p class="font-body-md text-[14px] text-on-surface-variant">{{ item.category.name }}</p>
          </div>
          <span class="font-body-md text-body-md font-semibold text-primary">{{ item.price }}₺</span>
        </div>
      </div>
    } @empty {
      <p class="col-span-full text-center font-body-md text-on-surface-variant py-16">
        Bu kategoride ürün bulunamadı.
      </p>
    }
  </div>
</section>
