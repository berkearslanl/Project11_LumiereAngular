<div class="bg-surface-container-lowest shadow-[0_4px_24px_rgba(124,82,99,0.05)] overflow-hidden">

  <!-- Toolbar -->
  <div class="flex justify-between items-center px-6 py-stack-md border-b border-outline-variant/30">
    <div>
      <h2 class="font-headline-md text-[20px] text-on-surface">Ürünler</h2>
      <p class="font-label-sm text-[12px] text-on-surface-variant">{{ products().length }} kayıt</p>
    </div>
    <a routerLink="/admin/products/create"
       class="flex items-center gap-2 bg-primary text-on-primary font-label-sm text-label-sm px-6 py-2.5 rounded-full hover:bg-secondary hover:text-on-secondary transition-colors duration-300">
      <span class="material-symbols-outlined text-[18px]">add</span>
      Yeni Ürün Ekle
    </a>
  </div>

  <!-- Table -->
  <div class="overflow-x-auto">
    <table class="w-full text-left">
      <thead>
        <tr class="border-b border-outline-variant/30">
          <th class="px-6 py-3 font-label-sm text-[11px] text-on-surface-variant uppercase tracking-widest">#</th>
          <th class="px-6 py-3 font-label-sm text-[11px] text-on-surface-variant uppercase tracking-widest">Görsel</th>
          <th class="px-6 py-3 font-label-sm text-[11px] text-on-surface-variant uppercase tracking-widest">Ürün Adı</th>
          <th class="px-6 py-3 font-label-sm text-[11px] text-on-surface-variant uppercase tracking-widest">Kategori</th>
          <th class="px-6 py-3 font-label-sm text-[11px] text-on-surface-variant uppercase tracking-widest">Fiyat</th>
          <th class="px-6 py-3 font-label-sm text-[11px] text-on-surface-variant uppercase tracking-widest text-right">İşlemler</th>
        </tr>
      </thead>
      <tbody>
        @for (item of products(); track $index) {
          <tr class="border-b border-outline-variant/10 hover:bg-surface-container-low/60 transition-colors duration-200">
            <td class="px-6 py-4 font-body-md text-on-surface-variant">{{ $index + 1 }}</td>
            <td class="px-6 py-4">
              <div class="w-14 h-14 bg-surface-container-low flex items-center justify-center overflow-hidden">
                <img [src]="item.imageUrl" [alt]="item.name" class="w-full h-full object-contain mix-blend-darken" />
              </div>
            </td>
            <td class="px-6 py-4 font-headline-md text-[15px] text-on-surface">{{ item.name }}</td>
            <td class="px-6 py-4">
              <span class="font-label-sm text-[11px] text-on-surface-variant bg-surface-container-low px-3 py-1 rounded-full">
                {{ item.category.name }}
              </span>
            </td>
            <td class="px-6 py-4 font-body-md font-semibold text-primary">{{ item.price }}₺</td>
            <td class="px-6 py-4">
              <div class="flex justify-end gap-2">
                <a [routerLink]="['update', item.id]"
                   class="flex items-center gap-1 px-4 py-2 rounded-full border border-outline-variant text-primary font-label-sm text-[12px] hover:bg-secondary hover:text-on-secondary hover:border-secondary transition-colors duration-200">
                  <span class="material-symbols-outlined text-[16px]">edit</span>
                  Güncelle
                </a>
                <button (click)="delete(item.id)"
                        class="flex items-center gap-1 px-4 py-2 rounded-full border border-error/40 text-error font-label-sm text-[12px] hover:bg-error-container hover:text-on-error-container hover:border-error transition-colors duration-200">
                  <span class="material-symbols-outlined text-[16px]">delete</span>
                  Sil
                </button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="px-6 py-16 text-center font-body-md text-on-surface-variant">
              Henüz ürün eklenmemiş.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
